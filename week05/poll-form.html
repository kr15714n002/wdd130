<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Content of the page">
    <meta name="author" content="Cristian Cornejo Farias">
    <title>Form</title>
    <link rel="stylesheet"  href="examplestyle.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML FORM - User Poll</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Contact information</legend>
                <label for="fullname">User's Full name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="useremail">User's email address</label>
                <input type="email" id="useremail" name="useremail" required>

            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <label for="browser">Select you favourite browser</label>
                <select name="browser" id="browser">
                    <option value="1">Chrome</option>
                    <option value="2">Firefox</option>
                    <option value="3">Edge</option>
                </select>

                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet" required>

                <label for="places">List the places you have lived:</label>
                <textarea name="places" id="places" rows="4" placeholder="Santiago - Chile, Lima - Peru, Buenos Aires - Argentina"></textarea>
            </fieldset>
            <button type="submit">Submit pool</button>
        </form>
    </main>
    <aside>
    </aside>

    <footer>
    </footer>
</body>

</html>
